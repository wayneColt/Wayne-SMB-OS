name: tests
on: [push, pull_request]
jobs:
  iceberg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/iceberg_check.sh
  node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [smb/call-qa/sys-net/rc-qa-ingress, smb/call-qa/sys-firewall/rc-qa-gate, smb/call-qa/disp-qube/rc-qa-infer, smb/identity, smb/bay, console]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # every worker uses Node built-ins only (node:test, node:assert, node:buffer); no install step
      - run: cd ${{ matrix.dir }} && node --test
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd apex/contract && cargo test
