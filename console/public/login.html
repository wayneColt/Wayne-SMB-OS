<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>WOSP · sign in</title>
<style>
:root{--bg:#05070a;--panel:#0a1016;--tile:#0e161e;--line:#182028;--line2:#22303a;--ink:#d7e0ea;--dim:#6a7a88;--mute:#3d4c58;--teal:#6cd6c6;--brass:#c4a05a;--kern:#4f8ef7;--drop:#e07070;--ok:#2dd4a0;--mono:"IBM Plex Mono","JetBrains Mono",ui-monospace,Menlo,monospace;--serif:"Fraunces","Iowan Old Style",Georgia,serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--mono);min-height:100vh;display:grid;place-items:center;padding:24px}
main{width:min(440px,100%);display:grid;gap:18px}
.mark{font:600 34px/1 var(--serif);letter-spacing:.02em}.mark em{font-style:normal;color:var(--brass)}
h1{font:500 20px/1.3 var(--serif);margin:0}p{margin:0;color:var(--dim)}
form{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px;display:grid;gap:12px}
label{display:grid;gap:6px;font-size:12px;color:var(--dim)}
input{font:inherit;background:var(--tile);color:var(--ink);border:1px solid var(--line2);border-radius:4px;padding:9px 10px}
input:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
button{font:inherit;background:var(--tile);color:#cfe0ff;border:1px solid var(--kern);border-radius:4px;padding:10px 14px;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.st{font-size:12px;color:var(--dim);min-height:18px}.ok{color:var(--ok)}.no{color:var(--drop)}.wait{color:var(--brass)}
code{color:var(--teal)}footer{color:var(--mute);font-size:12px;display:flex;gap:14px;flex-wrap:wrap}
</style></head><body><main>
<div><div class="mark">W<em>OSP</em></div><p>Wayne OS Platform · the Face is behind this door.</p></div>
<h1>Sign in as the operator.</h1>
<form id="login" autocomplete="on">
  <label>username<input id="user" name="username" value="operator@smbos" autocomplete="username" spellcheck="false"></label>
  <label>password<input id="pass" name="password" type="password" autocomplete="current-password" autofocus></label>
  <button id="go" type="submit">enter the Face</button>
  <div class="st" id="gate">probing the gate…</div>
  <div class="st" id="msg"></div>
</form>
<footer><span>fabricated:false</span><span>a session opens the Face's doors for 12 h</span><span>the Kernel still disposes · A=LAG</span></footer>
</main>
<script>
const $ = (id) => document.getElementById(id);
async function probe(){
  try{ const r = await fetch("/health", {cache:"no-store"}); const j = await r.json(); const g = j.gate || {};
    if (g.gate === "armed") $("gate").innerHTML = `<span class="ok">gate armed</span> · ${g.user} minted ${String(g.minted_at||"").slice(0,16).replace("T"," ")}Z`;
    else if (g.gate === "unminted") { $("gate").innerHTML = `<span class="wait">no operator minted yet</span> — open the mint on your glass (<code>WOSP_MINT_BOB_AT_WAYNE.html</code>) first`; $("go").disabled = true; }
    else $("gate").innerHTML = `<span class="no">gate ${g.gate||"NO_SIGNAL"}</span> — ${g.reason||""}`;
  }catch(e){ $("gate").innerHTML = `<span class="no">NO_SIGNAL</span> — ${e.message}`; }
}
$("login").addEventListener("submit", async (ev) => {
  ev.preventDefault(); $("go").disabled = true; $("msg").innerHTML = '<span class="wait">checking…</span>';
  try{
    const r = await fetch("/v1/auth/login", { method:"POST", headers:{ "content-type":"application/json" }, body: JSON.stringify({ username: $("user").value, password: $("pass").value }) });
    const j = await r.json();
    if (r.status === 200 && j.ok) { $("msg").innerHTML = `<span class="ok">welcome, ${j.user} · ${j.role}</span>`; location.replace("/"); return; }
    $("msg").innerHTML = `<span class="no">${r.status === 429 ? "too many tries" : "refused"}</span> — ${j.reason || "credentials refused"}`;
  }catch(e){ $("msg").innerHTML = `<span class="no">NO_SIGNAL</span> — ${e.message}`; }
  $("pass").value = ""; $("go").disabled = false; $("pass").focus();
});
probe();
</script></body></html>
